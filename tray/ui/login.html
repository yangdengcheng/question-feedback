<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { overflow:hidden; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#fff; user-select:none; }
  .wrap { padding:16px 22px; }
  h2 { font-size:15px; color:#1f2329; margin-bottom:2px; }
  .sub { font-size:11px; color:#86909c; margin-bottom:12px; line-height:1.5; }
  .sub a { color:#165dff; text-decoration:none; }
  .sub a:hover { text-decoration:underline; }
  .hint { font-size:11px; color:#86909c; margin-top:10px; line-height:1.5; }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script type="module">
import { createApp, h, ref, reactive, onMounted } from "vue";
// 显式具名导入组件（不依赖 app.use 全局注册——字符串组件名在构建产物中解析不可靠）
import { ElInput, ElCheckbox, ElButton } from "element-plus";
import "element-plus/dist/index.css";

const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);

// ---- 状态 ----
const form = reactive({ username: "", password: "", remember: false });
const msg = reactive({ text: "", type: "" });
const loading = ref(false);

function setMsg(text, type) {
  msg.text = text;
  msg.type = type;
}

async function doLogin() {
  if (!form.username || !form.password) {
    setMsg(!form.username && !form.password ? "请输入账号和密码" : !form.username ? "请输入账号" : "请输入密码", "err");
    return;
  }
  loading.value = true;
  setMsg("登录中...", "");
  try {
    // remember=true：记住密码（开机自启/人工启动托盘时用该账号自动登录）
    await invoke("try_login", {
      username: form.username,
      password: form.password,
      remember: form.remember,
      autoLogin: form.remember, // 记住密码即自动登录，二合一
    });
    setMsg("登录成功", "ok");
    setTimeout(() => invoke("close_login").catch(() => {}), 500);
  } catch (e) {
    setMsg(typeof e === "string" ? e : "登录失败，请检查网络", "err");
    loading.value = false;
  }
}

const App = {
  setup() {
    onMounted(async () => {
      // 每次打开都是全新表单：不回填任何历史账号
      form.username = "";
      form.password = "";
      form.remember = false;
    });
    return () =>
      h("div", [
        h("h2", "TradeMatrix 账号登录"),
        h("div", { class: "sub" }, [
          "账号密码加密仅存本机：",
          h("a", { onClick: () => invoke("open_data_dir").catch(() => {}) }, "打开数据文件夹"),
        ]),
        h(ElInput, {
          modelValue: form.username,
          "onUpdate:modelValue": (v) => (form.username = v),
          placeholder: "账号",
          autocomplete: "off",
          size: "large",
          style: "margin-bottom:10px",
        }),
        h(ElInput, {
          modelValue: form.password,
          "onUpdate:modelValue": (v) => (form.password = v),
          placeholder: "密码",
          type: "password",
          "show-password": true,
          size: "large",
          style: "margin-bottom:10px",
          onKeydown: (e) => { if (e.key === "Enter") doLogin(); },
        }),
        h("div", { style: "display:flex; margin-bottom:6px" }, [
          h(ElCheckbox, {
            modelValue: form.remember,
            "onUpdate:modelValue": (v) => (form.remember = v),
            label: "记住密码",
          }),
        ]),
        h(ElButton, {
          type: "primary",
          size: "large",
          style: "width:100%; margin-top:4px",
          loading: loading.value,
          onClick: doLogin,
        }, "登 录"),
        msg.text || msg.type
          ? h("div", {
              style: `font-size:12px; margin-top:8px; min-height:16px; color:${msg.type === "err" ? "#f53f3f" : msg.type === "ok" ? "#00b42a" : "#86909c"}`,
            }, msg.text)
          : h("div", { style: "height:24px" }),
        h("div", { class: "hint" }, "勾选「记住密码」后，每次开机自启或启动托盘时将自动用该账号登录"),
      ]);
  },
};

const app = createApp(App);
app.mount("#app");
</script>
</body>
</html>
