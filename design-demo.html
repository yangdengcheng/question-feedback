<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>问题反馈中心 · 主色方案对比</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0B1120; --surface:#121A2B; --surface-2:#1A2438;
    --line:rgba(148,163,184,.14); --line-strong:rgba(148,163,184,.24);
    --text:#E6EDF6; --text-2:#9AA7BC; --text-3:#5C6B82;
    --st-pending:#F59E0B; --st-processing:#38BDF8; --st-resolved:#34D399; --st-closed:#64748B;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --disp:"Space Grotesk","PingFang SC","Microsoft YaHei",sans-serif;
    --body:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--body); color:var(--text); min-height:100vh;
    background:
      radial-gradient(1100px 500px at 50% -8%, rgba(56,132,255,.10), transparent 70%),
      linear-gradient(rgba(148,163,184,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.045) 1px, transparent 1px),
      var(--ink);
    background-size:auto,32px 32px,32px 32px,auto;
    padding:40px 24px 64px;
  }
  .page-head{max-width:1400px;margin:0 auto 32px}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--text-3);text-transform:uppercase}
  .page-head h1{font-family:var(--disp);font-size:30px;font-weight:700;margin:8px 0 6px}
  .page-head p{color:var(--text-2);font-size:14px}
  .grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:24px;align-items:start}

  /* ---- variant panel ---- */
  .variant{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 12px 32px rgba(0,0,0,.35)}
  .variant-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .variant-head .name{font-family:var(--disp);font-weight:600;font-size:15px}
  .variant-head .hex{font-family:var(--mono);font-size:12px;color:var(--text-3)}
  .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--accent);margin-right:8px;vertical-align:-1px;box-shadow:0 0 10px var(--accent-glow)}

  /* mini nav */
  .nav{display:flex;align-items:center;gap:18px;padding:12px 18px;border-bottom:1px solid var(--line)}
  .brand{font-family:var(--disp);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .brand .mark{width:18px;height:18px;border-radius:5px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;color:#06121f;font-family:var(--mono);font-size:11px;font-weight:700;box-shadow:0 0 12px var(--accent-glow)}
  .nav a{font-size:13px;color:var(--text-3);text-decoration:none;padding:4px 2px;border-bottom:2px solid transparent}
  .nav a.active{color:var(--accent);border-bottom-color:var(--accent)}
  .nav .spacer{flex:1}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-2)}

  /* overview strip */
  .strip{display:flex;padding:16px 18px;gap:0;border-bottom:1px solid var(--line)}
  .stat{flex:1;padding:0 14px;border-left:1px solid var(--line)}
  .stat:first-child{border-left:none;padding-left:0}
  .stat .num{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1}
  .stat .num.tick{color:var(--accent)}
  .stat .lbl{font-size:12px;color:var(--text-3);margin-top:6px;display:flex;align-items:center;gap:6px}
  .stat .lbl::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--dot,var(--text-3))}

  /* ticket list */
  .rows{padding:8px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;border-left:2px solid transparent;transition:background .15s}
  .row:hover{background:rgba(148,163,184,.05)}
  .row.selected{background:var(--accent-soft);border-left-color:var(--accent)}
  .row .no{font-family:var(--mono);font-size:11px;color:var(--text-3);width:96px;flex-shrink:0}
  .row.selected .no{color:var(--accent)}
  .row .title{flex:1;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid;flex-shrink:0}
  .badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-pending{color:var(--st-pending);border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.08)}
  .b-processing{color:var(--st-processing);border-color:rgba(56,189,248,.35);background:rgba(56,189,248,.08)}
  .b-resolved{color:var(--st-resolved);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
  .row .time{font-family:var(--mono);font-size:11px;color:var(--text-3);width:76px;text-align:right;flex-shrink:0}

  /* controls */
  .controls{display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
  .btn{font-size:13px;font-weight:600;padding:8px 16px;border-radius:7px;border:1px solid transparent;cursor:pointer;font-family:var(--body);transition:all .15s}
  .btn-primary{background:var(--accent);color:#06121f;box-shadow:0 0 0 0 var(--accent-glow)}
  .btn-primary:hover{box-shadow:0 0 16px var(--accent-glow);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--text-2);border-color:var(--line-strong)}
  .btn-ghost:hover{color:var(--accent);border-color:var(--accent)}
  .input{flex:1;background:var(--ink);border:1px solid var(--line-strong);border-radius:7px;padding:8px 12px;color:var(--text);font-size:13px;font-family:var(--body);outline:none}
  .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .input::placeholder{color:var(--text-3)}

  .foot{max-width:1400px;margin:28px auto 0;color:var(--text-3);font-size:12px;font-family:var(--mono)}
</style>
</head>
<body>
  <div class="page-head">
    <div class="eyebrow">Design Direction · Engineering Console</div>
    <h1>问题反馈中心 · 主色方案对比</h1>
    <p>三套方案共用同一设计系统（深海军蓝底 · 蓝图网格 · Space Grotesk 标题 · JetBrains Mono 数据），仅主操作色不同。状态色（琥珀/天蓝/绿）为功能色，三套一致。</p>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot">// 在浏览器直接打开本文件即可 · 选定后告诉我用哪套</div>

<script>
const variants = [
  { key:"A", name:"青绿 Teal",  hex:"#2DD4BF", accent:"#2DD4BF", glow:"rgba(45,212,191,.35)", soft:"rgba(45,212,191,.10)" },
  { key:"B", name:"电光蓝 Sky", hex:"#38BDF8", accent:"#38BDF8", glow:"rgba(56,189,248,.35)", soft:"rgba(56,189,248,.10)" },
  { key:"C", name:"信号橙 Amber",hex:"#F59E0B", accent:"#FBBF24", glow:"rgba(251,191,36,.32)", soft:"rgba(251,191,36,.10)" },
];
const rows = [
  { no:"TK20260730001", title:"导出报表时日期筛选不生效", st:"pending", stTxt:"待处理", time:"07/30 14:22", sel:false },
  { no:"TK20260730002", title:"登录页验证码偶发加载失败", st:"processing", stTxt:"处理中", time:"07/30 11:08", sel:true },
  { no:"TK20260729014", title:"权限分配后菜单未即时刷新", st:"resolved", stTxt:"已解决", time:"07/29 18:40", sel:false },
];
function variantHTML(v){
  return `
  <div class="variant" style="--accent:${v.accent};--accent-glow:${v.glow};--accent-soft:${v.soft}">
    <div class="variant-head">
      <span class="name"><span class="swatch"></span>方案 ${v.key} · ${v.name}</span>
      <span class="hex">${v.hex}</span>
    </div>
    <div class="nav">
      <span class="brand"><span class="mark">Q</span>问题反馈中心</span>
      <a href="#" class="active">看板</a><a href="#">工单</a><a href="#">通知</a>
      <span class="spacer"></span><span class="avatar">林</span>
    </div>
    <div class="strip">
      <div class="stat"><div class="num tick">12</div><div class="lbl" style="--dot:var(--st-pending)">待处理</div></div>
      <div class="stat"><div class="num">8</div><div class="lbl" style="--dot:var(--st-processing)">处理中</div></div>
      <div class="stat"><div class="num">31</div><div class="lbl" style="--dot:var(--st-resolved)">已解决</div></div>
      <div class="stat"><div class="num">5</div><div class="lbl" style="--dot:var(--st-closed)">已关闭</div></div>
    </div>
    <div class="rows">
      ${rows.map(r=>`
      <div class="row${r.sel?' selected':''}">
        <span class="no">${r.no}</span>
        <span class="title">${r.title}</span>
        <span class="badge b-${r.st}"><i></i>${r.stTxt}</span>
        <span class="time">${r.time}</span>
      </div>`).join("")}
    </div>
    <div class="controls">
      <button class="btn btn-primary">新建工单</button>
      <button class="btn btn-ghost">筛选</button>
      <input class="input" placeholder="搜索工单编号 / 标题…" />
    </div>
  </div>`;
}
document.getElementById("grid").innerHTML = variants.map(variantHTML).join("");
</script>
</body>
</html>
