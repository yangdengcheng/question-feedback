[package]
name = "tradematrix-tray"
version = "1.1.0"
description = "TradeMatrix desktop tray client"
authors = ["R&D Dept"]
edition = "2021"

[lib]
name = "tradematrix_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "lib.rs"

[[bin]]
name = "tradematrix-tray"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
tungstenite = "0.24"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
